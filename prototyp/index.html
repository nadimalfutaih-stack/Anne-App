<title>Mein Tag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&display=swap">
<style>
/* Layout: ein Zettel. Oben "Als Nächstes", darunter der Tag, unten vier große Tasten. Große Schrift, ausgeschriebene Wörter. */
:root{
  --bg:#f6f3ee; --paper:#ffffff; --fg:#1f1d1b; --muted:#6a645d; --line:#e4ded5;
  --accent:#1f6f5c; --accent-soft:#e1efe9; --warn:#a8461f; --warn-soft:#f7e6dd;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171614; --paper:#22201d; --fg:#f2eee8; --muted:#b1a99f; --line:#38342f;
  --accent:#6fc7ad; --accent-soft:#1d3530; --warn:#f2a07c; --warn-soft:#3b261c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171614; --paper:#22201d; --fg:#f2eee8; --muted:#b1a99f; --line:#38342f;
  --accent:#6fc7ad; --accent-soft:#1d3530; --warn:#f2a07c; --warn-soft:#3b261c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:19px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.demo{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
h1{font-family:var(--display);font-size:32px;line-height:1.15;margin:0;text-wrap:balance}
.date{margin:2px 0 0;color:var(--muted)}
.checked{font-size:15px;color:var(--muted);margin-top:6px}
.next{background:var(--accent-soft);border-radius:18px;padding:16px 18px}
.next .lbl{font-size:16px;font-weight:700;color:var(--accent)}
.next .what{font-family:var(--display);font-size:27px;line-height:1.2;margin-top:2px}
.next .time{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.list{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:18px}
.row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .tm{font-weight:700;font-variant-numeric:tabular-nums;min-width:58px}
.row .t{min-width:0;overflow-wrap:anywhere}
.hint{display:block;font-size:15px;color:var(--muted)}
.hint i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tick{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:22px;color:var(--paper);padding:0}
.done .tick{background:var(--accent);border-color:var(--accent)}
.done .t{color:var(--muted);text-decoration:line-through}
.empty{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px}
.empty small{display:block;color:var(--muted);font-size:16px;margin-top:4px}
.later .row{color:var(--muted)}
.search{width:100%;font:inherit;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--fg)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav button{font:inherit;font-size:17px;font-weight:700;padding:14px 4px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--fg);cursor:pointer}
nav button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,.search:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 16px;display:flex;gap:16px;align-items:center;font-size:17px;max-width:calc(100% - 32px)}
.toast button{font:inherit;font-weight:700;background:none;border:0;color:var(--accent-soft);text-decoration:underline;cursor:pointer;padding:4px}
.cheer{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:no-preference){.row{transition:opacity .25s}}
</style>

<div class="wrap">
  <div class="demo">Entwurf mit <b>Beispieleinträgen</b>. Später stehen hier Annes echte Kalendereinträge.</div>
  <header>
    <h1 id="hello">Guten Morgen, Anne!</h1>
    <p class="date" id="date"></p>
    <div class="checked" id="checked"></div>
  </header>
  <main id="view"></main>
</div>

<nav aria-label="Ansicht wählen"><div>
  <button data-v="heute" aria-pressed="true">Heute</button>
  <button data-v="morgen" aria-pressed="false">Morgen</button>
  <button data-v="danach" aria-pressed="false">Danach</button>
  <button data-v="suchen" aria-pressed="false">Suchen</button>
</div></nav>
<div class="toast" id="toast" hidden role="status"><span id="toastText">Erledigt</span><button id="undo">Rückgängig</button></div>

<script>
// Kleine Hinweise: zuerst persönliche Regeln (Namen der Kinder), dann wenige eindeutige Wörter. Unklares bekommt keinen Hinweis.
const HINTS = [
  {name:"Kinder",    color:"#d9822b", words:["mia","kita","schule","turnbeutel","elternabend","schwimmkurs","wechselkleidung"]},
  {name:"Arzt",      color:"#c0392b", words:["arzt","kinderarzt","zahnarzt","u-untersuchung","impfung"]},
  {name:"Einkauf",   color:"#2f9e6b", words:["kaufen","milch","brot","windeln","rewe","besorgen"]},
  {name:"Unterlagen",color:"#7d5bbf", words:["unterlagen","steuer","versicherung","kündigen","formular","antrag"]},
  {name:"Geburtstag",color:"#c2407e", words:["geburtstag","geschenk"]},
  {name:"Haushalt",  color:"#5f8597", words:["tonne","handwerker","heizung","wäsche"]},
];
// d = Tage ab heute, time = Uhrzeit (ohne = ganztägig)
const EXAMPLES = [
  {t:"Kinderarzt mit Mia", d:0, time:"10:30"},
  {t:"Mia Turnbeutel", d:0},
  {t:"Milch und Brot kaufen", d:0},
  {t:"Kaffee mit Lisa", d:0, time:"15:00"},
  {t:"Gelbe Tonne rausstellen", d:0, time:"20:00"},
  {t:"Elternabend Kita", d:1, time:"19:30"},
  {t:"Oma", d:1},
  {t:"Unterlagen", d:1},
  {t:"Geschenk für Omas Geburtstag besorgen", d:3},
  {t:"Steuerunterlagen an Steuerberater", d:4},
  {t:"Zahnarzt Kontrolle", d:6, time:"08:40"},
  {t:"Handwerker Heizung", d:9, time:"08:00"},
];

const today = new Date(); today.setHours(0,0,0,0);
const now = new Date();
const fmtDay = new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long"});
const fmtShort = new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long"});
const dateOf = d => { const x = new Date(today); x.setDate(x.getDate()+d); return x; };

const h = now.getHours();
document.getElementById("hello").textContent = h < 11 ? "Guten Morgen, Anne!" : h < 18 ? "Hallo Anne!" : "Guten Abend, Anne!";
document.getElementById("date").textContent = "Heute ist " + fmtDay.format(today) + ".";
document.getElementById("checked").textContent = "Zuletzt geprüft um " + now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) + " Uhr";

function hintFor(title){
  const low = title.toLowerCase();
  return HINTS.find(c => c.words.some(w => low.includes(w))) || null;
}
const items = EXAMPLES.map((e,i)=>({...e, id:"e"+i, hint:hintFor(e.t)}));

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem("meintag-done")||"[]")); } catch(_){}
const save = () => { try { localStorage.setItem("meintag-done", JSON.stringify([...done])); } catch(_){} };

let view = "heute", q = "", lastDone = null, toastTimer = null;
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nowMin = now.getHours()*60 + now.getMinutes();
const mins = t => { const [a,b] = t.split(":").map(Number); return a*60+b; };

function row(i, withTick=true){
  const hint = i.hint ? `<span class="hint"><i style="background:${i.hint.color}"></i>${i.hint.name}</span>` : "";
  const isDone = done.has(i.id);
  const left = withTick
    ? `<button class="tick" data-id="${i.id}" aria-label="${isDone?"Zurückholen":"Abhaken"}: ${esc(i.t)}">${isDone?"✓":""}</button>`
    : `<span class="tm">${i.time || ""}</span>`;
  const tm = withTick && i.time ? `<b class="tm">${i.time}</b> ` : "";
  return `<li class="row${isDone?" done":""}">${left}<div class="t">${tm}${esc(i.t)}${hint}</div></li>`;
}
function dayBlock(d, labelTimed, labelAllDay){
  const list = items.filter(i=>i.d===d);
  const timed = list.filter(i=>i.time && !done.has(i.id) && (d>0 || mins(i.time) >= nowMin - 30)).sort((a,b)=>a.time.localeCompare(b.time));
  const allDay = list.filter(i=>!i.time && !done.has(i.id));
  const finished = list.filter(i=>done.has(i.id));
  let html = "";
  if (!timed.length && !allDay.length){
    const nxt = items.filter(i=>i.d>d).sort((a,b)=>a.d-b.d)[0];
    html += `<div class="empty">${d===0?"Heute":"Morgen"} steht nichts mehr an.${nxt?`<small>Danach: ${esc(nxt.t)}, ${fmtShort.format(dateOf(nxt.d))}</small>`:""}</div>`;
  }
  if (timed.length) html += `<section><h2>${labelTimed}</h2><ul class="list">${timed.map(i=>row(i)).join("")}</ul></section>`;
  if (allDay.length) html += `<section><h2>${labelAllDay}</h2><ul class="list">${allDay.map(i=>row(i)).join("")}</ul></section>`;
  if (finished.length) html += `<section><h2>${d===0?"Heute erledigt":"Erledigt"}</h2><p class="cheer" style="margin:0 0 8px">${d===0?`Heute geschafft: ${finished.length} ${finished.length===1?"Ding":"Dinge"}`:""}</p><ul class="list">${finished.map(i=>row(i)).join("")}</ul></section>`;
  return html;
}
function render(){
  const v = document.getElementById("view");
  let html = "";
  if (view==="heute"){
    const next = items.filter(i=>i.d===0 && i.time && !done.has(i.id) && mins(i.time) >= nowMin - 30).sort((a,b)=>a.time.localeCompare(b.time))[0];
    if (next) html += `<div class="next"><div class="lbl">Als Nächstes</div><div class="what"><span class="time">${next.time} Uhr</span><br>${esc(next.t)}</div></div>`;
    html += dayBlock(0, "Termine heute", "Heute zu erledigen");
  } else if (view==="morgen"){
    html += `<h1 style="font-size:26px">Morgen, ${fmtShort.format(dateOf(1))}</h1>` + dayBlock(1, "Termine", "Zu erledigen");
  } else if (view==="danach"){
    const later = items.filter(i=>i.d>1).sort((a,b)=>a.d-b.d || (a.time||"99").localeCompare(b.time||"99"));
    const byDay = {};
    later.forEach(i=>{ (byDay[i.d] ||= []).push(i); });
    html += Object.entries(byDay).map(([d,l])=>`<section class="later"><h2>${fmtShort.format(dateOf(+d))}</h2><ul class="list">${l.map(i=>row(i,false)).join("")}</ul></section>`).join("") || `<div class="empty">Danach steht noch nichts im Kalender.</div>`;
  } else {
    html += `<input id="q" class="search" type="search" placeholder="Was suchst du? z. B. Turnbeutel" aria-label="Im Kalender suchen" value="${esc(q)}">`;
    if (q){
      const hits = items.filter(i=>i.t.toLowerCase().includes(q) || (i.hint && i.hint.name.toLowerCase().includes(q))).sort((a,b)=>a.d-b.d);
      html += hits.length
        ? `<ul class="list" style="margin-top:14px">${hits.map(i=>`<li class="row"><span class="tm">${i.time||""}</span><div class="t">${esc(i.t)}<span class="hint">${i.d===0?"Heute":i.d===1?"Morgen":fmtShort.format(dateOf(i.d))}</span></div></li>`).join("")}</ul>`
        : `<div class="empty" style="margin-top:14px">Dazu habe ich nichts gefunden.<small>Versuch ein anderes Wort.</small></div>`;
    }
  }
  v.innerHTML = `<div style="display:grid;gap:20px">${html}</div>`;
  if (view==="suchen"){ const inp = document.getElementById("q"); inp.addEventListener("input", e=>{ q = e.target.value.trim().toLowerCase(); render(); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }); }
}
function pling(){
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; o.type = "sine";
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.4);
  } catch(_){}
}
function showToast(text, undoable){
  const t = document.getElementById("toast");
  document.getElementById("toastText").textContent = text;
  document.getElementById("undo").hidden = !undoable;
  t.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.hidden = true; }, 6000);
}
document.addEventListener("click", ev=>{
  const nb = ev.target.closest("nav button");
  if (nb){ view = nb.dataset.v; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed", b===nb)); render(); window.scrollTo(0,0); if (view==="suchen") document.getElementById("q").focus(); return; }
  const tk = ev.target.closest(".tick");
  if (tk){
    const id = tk.dataset.id;
    if (done.has(id)){ done.delete(id); showToast("Wieder offen", false); }
    else { done.add(id); lastDone = id; pling(); showToast("Erledigt", true); }
    save(); render(); return;
  }
  if (ev.target.id==="undo" && lastDone){ done.delete(lastDone); lastDone = null; save(); render(); document.getElementById("toast").hidden = true; }
});
render();
</script>
