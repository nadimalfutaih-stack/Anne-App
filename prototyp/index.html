<style>

:root{ color-scheme:light;

  --bg:#EEF4EF; --card:#FFFFFF; --fg:#1D2A36; --muted:#56616C; --line:#DCE6DE;

  --today:#C62835; --sun:#FFD24A; --sun-bg:#173653;
  --next-lbl:#8A5A00;
  --cal-kalender:#C21878; --cal-privat:#006D73; --cal-arbeit:#BD590D; --cal-nadim:#245EB5;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;

html{font:-apple-system-body;font-family:var(--font)}
@supports not (font:-apple-system-body){html{font-size:17px}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1.059rem;line-height:1.35;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding-block:.75rem calc(var(--navh,6.5rem) + 1rem);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo{font-size:.82rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:.4rem .7rem;margin-bottom:.8rem}

.appbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.93rem;color:var(--muted)}
.brand svg{width:1.57rem;height:1.57rem;flex:none}
.calbtn{display:inline-flex;align-items:center;min-height:40px;padding:.3rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-weight:600;font-size:.9rem;text-decoration:none}

.titlebar{display:flex;align-items:center;flex-wrap:wrap;gap:.3rem .6rem;margin-top:.7rem}
h1{font-weight:800;font-size:min(1.857rem,9vw);letter-spacing:-.02em;line-height:1.1;margin:0}
.daycircle{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--today);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.96rem;font-variant-numeric:tabular-nums}
.sub{font-size:1.07rem;color:var(--muted);font-weight:400}
.greet{font-size:1.07rem;color:var(--fg);margin-top:.1rem;font-weight:600}

.nextcard{margin-top:.85rem;background:var(--next);border-radius:14px;padding:.7rem .85rem;display:grid;grid-template-columns:4px minmax(0,1fr);gap:.7rem}
.nextcard .bar{margin:0}
.nextcard .lbl{font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--next-lbl);font-variant-numeric:tabular-nums}
.nextcard .w{font-size:1.21rem;font-weight:700;line-height:1.2;margin-top:.05rem;overflow-wrap:anywhere}
.nextcard .m{font-size:.93rem;color:#6B5A33}

.sect{margin-top:.7rem}
.tilesec{margin-top:.75rem}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
.tile{font:inherit;text-align:left;cursor:pointer;background:var(--card);color:var(--fg);border:0;border-radius:13px;padding:.5rem .6rem;min-height:44px;display:grid;gap:.05rem;position:relative;box-shadow:0 1px 0 var(--line)}
.tile .ic{font-size:1.15rem;line-height:1.1}
.tile b{font-size:.93rem;font-weight:700}
.tile small{font-size:.8rem;color:var(--muted)}
.tile .n{position:absolute;top:.45rem;right:.5rem;font-size:.8rem;font-weight:700;color:#fff;background:var(--tc);border-radius:999px;min-width:1.4rem;height:1.4rem;display:grid;place-items:center;padding:0 .35rem;font-variant-numeric:tabular-nums}
.tile.on{outline:2.5px solid var(--nav-on);outline-offset:-2.5px}
/* Fragefeld statt Sprachknopf: Anne tippt oder diktiert über die iPhone-Tastatur (Mikrofon der Tastatur / Wispr Flow) */
.frage{display:flex;gap:.45rem;align-items:stretch;margin-top:1rem}
.frage input{flex:1;min-width:0;min-height:3.2rem;font:inherit;font-size:max(16px,1.07rem);color:var(--fg);background:var(--card);border:2px solid var(--nav-on);border-radius:14px;padding:.55rem .85rem;-webkit-appearance:none;appearance:none}
.frage input::placeholder{color:var(--muted)}
.frage button{min-height:3.2rem;min-width:3.6rem;padding:0 1.1rem;border:0;border-radius:14px;background:var(--nav-on);color:#fff;font:inherit;font-weight:700;font-size:1.07rem;cursor:pointer;touch-action:manipulation}
.frage button:active{transform:scale(.97)}
.ftipp{font-size:.86rem;color:var(--muted);text-align:center;margin-top:.35rem}
.ftipp.warn{color:#8A5A00;font-weight:600}
.ftipp.ok{color:#2F6B45;font-weight:600}

.vorschlag{margin-top:.7rem;background:var(--card);border:2px solid var(--next);border-radius:14px;padding:.8rem;display:grid;gap:.55rem}
.vorschlag label{font-size:.86rem;color:var(--muted);font-weight:600}
.vorschlag input{font:inherit;font-size:max(16px,1.07rem);font-weight:600;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:.5rem .7rem;min-height:2.9rem;-webkit-appearance:none;appearance:none}
.vtage{display:flex;flex-wrap:wrap;gap:.4rem}
.vtag{font:inherit;font-size:.95rem;font-weight:600;min-height:44px;padding:.3rem .95rem;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.vtag.on{background:var(--nav-on);border-color:var(--nav-on);color:#fff}
.vknopf{font:inherit;font-size:1.05rem;font-weight:700;min-height:52px;border-radius:12px;border:0;background:var(--nav-on);color:#fff;cursor:pointer}
.vleise{font:inherit;font-size:.95rem;font-weight:600;min-height:44px;border:0;background:none;color:var(--muted);cursor:pointer}
.vteile{display:flex;flex-wrap:wrap;gap:.3rem .35rem;align-items:center;font-size:.86rem}
.vteile span{width:100%;color:var(--muted);font-weight:600}
.vteile b{font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.15rem .6rem}
.vreihe{display:flex;justify-content:space-between;gap:.5rem}
.pick{margin-top:.9rem;display:flex;gap:.7rem;align-items:center;background:var(--card);border-radius:14px;padding:.85rem 1rem}
.pick span{font-size:1.4rem}
.pick b{display:block;font-size:1rem}
.pick small{display:block;color:var(--muted);font-size:.9rem}
.tile.has-neu{box-shadow:inset 0 0 0 2px #FFD24A}
.tile.on.has-neu{outline-color:var(--nav-on)}
.tile .nb{position:absolute;bottom:.4rem;right:.45rem;font-size:.66rem;font-weight:800;letter-spacing:.04em;background:#FFD24A;color:#1D2A36;border-radius:999px;padding:.05rem .4rem}
.row.neu{background:#FFF6D9}
.neutag{display:inline-block;margin-left:.35rem;font-size:.66rem;font-weight:800;letter-spacing:.04em;background:#FFD24A;color:#1D2A36;border-radius:999px;padding:.05rem .4rem;vertical-align:.1rem}
nav button{position:relative}
.cathead{display:flex;align-items:center;gap:.6rem;margin-top:.9rem;flex-wrap:wrap}
.cathead h2{margin:0;font-size:1.3rem;font-weight:800}
.cathead span{color:var(--muted);font-size:.93rem}
.catclose{margin-left:auto;font:inherit;font-size:.9rem;font-weight:600;min-height:40px;padding:.3rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.sect h2{font-size:1.059rem;font-weight:700;margin:0 0 .45rem .2rem}
.listcard{background:var(--card);border-radius:14px;overflow:hidden}
.list{list-style:none;margin:0;padding:0}
.row{padding-left:.85rem !important;padding-right:.85rem !important;display:grid;grid-template-columns:3.6rem 4px minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--line);min-height:3.43rem}
.row:last-child{border-bottom:0}
/* Erledigte Einträge nach links wischen = löschen */
.swrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swrap:last-child{border-bottom:0}
.swrap .row{position:relative;background:var(--card);border-bottom:0;touch-action:pan-y;transition:transform .18s ease-out;will-change:transform}
.swrap .row.zieht{transition:none}
.swrap .del{position:absolute;top:0;bottom:0;right:0;width:6.2rem;border:0;background:#C62835;color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;visibility:hidden}
.swrap.auf .del{visibility:visible}
.sect h2 small{font-weight:500;font-size:.8rem;color:var(--muted)}
.time{font-variant-numeric:tabular-nums;font-size:.93rem;font-weight:400;line-height:1.25;white-space:nowrap}
.time small{display:block;font-size:.941rem;font-weight:400;color:var(--muted)}
.time.allday{font-size:.86rem;font-weight:400;color:var(--fg)}
.bar{align-self:stretch;margin-block:.15rem;border-radius:3px;background:var(--c)}
.t{font-size:1.07rem;font-weight:600;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.cal{display:block;font-size:.86rem;font-weight:400;color:var(--muted);margin-top:.05rem}
.tick{width:2.6rem;height:2.6rem;min-width:44px;min-height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--card);font-size:1.05rem;font-weight:800;position:relative}
.tick::before{content:"";position:absolute;inset:.55rem;border-radius:50%;border:2px solid var(--fg)}
.tick span{position:relative}
.row>.tick{margin-right:-.4rem}
.done .tick::before{background:var(--fg)}
.done .t{color:var(--muted)}
.done .t .txt{text-decoration:line-through}
.done .bar{opacity:.35}
.donetag{display:block;font-size:.941rem;font-weight:700;color:var(--fg)}
.empty{padding:1rem 0}
.empty small{display:block;color:var(--muted);font-size:.941rem;margin-top:.25rem}
.cheer{font-weight:600;font-size:.941rem;margin:0 0 .45rem .2rem;color:var(--muted)}
.search{width:100%;font:inherit;font-size:1.176rem;min-height:52px;padding:.7rem 1rem;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);margin-top:1.1rem}

nav div{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem}

nav{container:nav/inline-size}
@container nav (max-width:16.8rem){nav div{grid-template-columns:repeat(2,minmax(0,1fr))}}
nav button{font:inherit;font-size:.96rem;font-weight:600;min-height:44px;padding:.5rem .15rem;border-radius:12px;border:0;background:var(--nav);color:var(--nav-fg);cursor:pointer}
nav button[aria-pressed="true"]{background:var(--nav-on);color:var(--nav-on-fg)}
button:focus-visible,.tile:focus-visible,.search:focus-visible,.calbtn:focus-visible{outline:3px solid var(--nav-on);outline-offset:2px}

.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--navh,5.4rem) + .5rem);background:var(--nav-on);color:var(--nav-on-fg);border-radius:999px;padding:.25rem .25rem .25rem 1rem;display:flex;gap:.5rem;align-items:center;font-size:.941rem;font-weight:600;white-space:nowrap;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{font:inherit;font-weight:700;min-height:44px;background:var(--card);color:var(--fg);border:0;border-radius:999px;padding:.3rem .9rem;cursor:pointer}
/* Schmaler Bildschirm oder sehr große Schrift: Uhrzeit rückt über den Titel, damit der Titel die volle Breite bekommt. */
.listcard{container:list/inline-size}

  .row{grid-template-columns:6px minmax(0,1fr) auto;grid-template-areas:"bar time tick" "bar t tick";row-gap:.15rem;gap:.15rem .75rem}
  .row>.time{grid-area:time} .row>.bar{grid-area:bar} .row>.t{grid-area:t} .row>:last-child{grid-area:tick}

@media (max-width:360px){.listcard{padding:0 .75rem}}

// Versteht ISO 8601 und typische Kurzbefehl-Formate: "20.11.26, 10:30", "20. Nov. 2026 um 10:30", "Heute um 10:30" …
function parseDate(v){
  v = (v||"").trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(v)) return new Date(v);
  const low = v.toLowerCase().replace(/\u202f|\u00a0/g," ");

  const base = new Date(); base.setHours(0,0,0,0);
  const rel = {heute:0, today:0, morgen:1, tomorrow:1, gestern:-1, yesterday:-1, "übermorgen":2};
  for (const [w,o] of Object.entries(rel)) if (low.startsWith(w)) { const x = new Date(base); x.setDate(x.getDate()+o); x.setHours(hh,mm); return x; }
  let m = low.match(/^(\d{1,2})\s*[./-]\s*(\d{1,2})\s*[./-]?\s*(\d{4}|\d{2}(?!\d|[:.]\d))?/);

  if (m) { d=+m[1]; mo=+m[2]; y=m[3]?+m[3]:base.getFullYear(); }

    if (n && MONTHS[n[2]]) { d=+n[1]; mo=MONTHS[n[2]]; y=n[3]?+n[3]:base.getFullYear(); }
    else if (e && MONTHS[e[1]]) { d=+e[2]; mo=MONTHS[e[1]]; y=e[3]?+e[3]:base.getFullYear(); }

function readShortcutData(){
  const m = location.hash.match(/^#d=(.+)$/);
  if (!m) return null;
  try {
    let b = decodeURIComponent(m[1]).replace(/-/g,"+").replace(/_/g,"/").replace(/\s/g,"");
    while (b.length % 4) b += "=";
    const text = new TextDecoder().decode(Uint8Array.from(atob(b), c=>c.charCodeAt(0)));
    const t0 = new Date(); t0.setHours(0,0,0,0);
    const hm = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    STATS.chars = text.length;
    const rows = text.split(/\r?\n/).map(l=>{ const sep = l.includes("|") ? "|" : ";"; const p = l.split(sep); while (p.length > 5) { p[1] = p[0] + sep + p[1]; p.shift(); } return p; }).filter(p=>p.length>=5 && p[0].trim());
    STATS.lines = rows.length;
    const out = rows.map(p=>{
      const [t, s, e, ad, cal] = p.map(x=>x.trim());
      if (!STATS.sampleStart) STATS.sampleStart = s;
      if (!STATS.cals.includes(cal)) STATS.cals.push(cal);
      const start = parseDate(s), end = parseDate(e);
      if (isNaN(start)) return null;
      STATS.dates++;
      const day = new Date(start); day.setHours(0,0,0,0);
      const allDay = /^(ja|yes|true|1|wahr)$/i.test(ad);
      return { t, d: Math.round((day - t0) / 864e5), time: allDay ? undefined : hm(start), end: allDay || isNaN(end) ? undefined : hm(end), cal: calKey(cal), key: t + "@" + s };
    }).filter(x=>x && x.d >= 0 && SHOW_CALS.includes(x.cal));
    STATS.shown = out.length;

  } catch(err) { STATS.err = String(err && err.message || err); return []; }

// Kalender-Einträge: nur bei Spiegelstrich-Listen (beginnt mit "-" oder mindestens 3 Teile) – "Arzt - Wim" bleibt ganz.
// Getipptes/Gesprochenes (weit = true): zusätzlich bei Komma und Semikolon; bei "und" nicht, wenn es um Personen/Verabredungen geht.
function teile(text, weit){
  const roh = String(text || "").trim();
  const putz = x => { x = x.replace(/^[\s\-–—•*]+/,"").replace(/[\s.]+$/,"").trim(); return x ? x.charAt(0).toUpperCase() + x.slice(1) : ""; };
  let parts = roh.split(/\s+[-–—•]\s+|\n+/).map(putz).filter(Boolean);
  const startStrich = /^[-–—•]\s/.test(roh);
  if (!weit) return (startStrich || parts.length >= 3) && parts.length > 1 ? parts : [roh];
  parts = parts.flatMap(x => x.split(/\s*[,;]\s*/)).map(putz).filter(Boolean);
  // "und" trennt Listen ("Brot und Aspirin"), aber nicht Personen/Verabredungen: "Hermine und Wim abholen", "Kaffee mit Lisa und Tom" bleiben ganz.
  parts = parts.flatMap(x => { const u = x.split(/\s+und\s+/i).map(putz).filter(Boolean);
    const ganz = u.length < 2 || /(^|\s)(mit|bei|von|für|zu|zum|zur)\s/i.test(x) || u.some(y => catsFor(y).some(c => c === "Kinder" || c === "Treffen"));
    return ganz ? [x] : u; });
  return parts.length ? parts : (putz(roh) ? [putz(roh)] : []);
}
const mkItem = (e, t, id) => { const cats = catsFor(t); return {...e, t, id, cats, hint: cats.join(" · "), task: !e.time && !/geburtstag/i.test(t)}; };
const items = EXAMPLES.flatMap((e,i)=>{ const id = e.key || "e"+i, ps = teile(e.t, false);
  return ps.length > 1 ? ps.map((t,n)=>mkItem(e, t, id + "#" + n)) : [mkItem(e, e.t, id)]; });
// ---------- Eigene Einträge: in der App selbst gespeichert (auf diesem iPhone), damit sie SOFORT im Kästchen stehen ----------
// Kommt derselbe Eintrag (gleicher Titel, gleicher Tag) später aus dem Kalender, wird die eigene Kopie entfernt.
const tagKey = d => { const x = dateOf(d); return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0"); };
// Ein Datum im Text erkennen ("am 28. Dezember", "28.12.", "am 28.", "in 3 Tagen", "nächste Woche") und aus dem Titel nehmen.
// Liegt das Datum dieses Jahr schon in der Vergangenheit, ist nächstes Jahr gemeint. Gibt {t, d} zurück oder null.
function datumAus(text){
  const MON = ["jan","feb","mär|maer|mar","apr","mai","jun","jul","aug","sep","okt","nov","dez"];
  const ZAHL = {einem:1,einer:1,ein:1,zwei:2,drei:3,vier:4,fünf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10};
  const tage = (tag, mon, jahr) => { let x = new Date(jahr || today.getFullYear(), mon, tag);
    if (x.getMonth() !== mon || x.getDate() !== tag) return null;
    if (!jahr && x < today) x = new Date(today.getFullYear() + 1, mon, tag);
    return Math.round((x - today) / 864e5); };
  const fertig = (m, d) => (d === null || d < 0) ? null : {t: text.replace(m[0], " ").replace(/\s+/g, " ").trim(), d};
  let m = text.match(new RegExp("(?:^|\\s)(?:am\\s+|den\\s+|zum\\s+|für\\s+den\\s+)?(\\d{1,2})\\.?\\s*(" + MON.map(x => "(?:" + x + ")\\p{L}*").join("|") + ")\\.?(?:\\s+(\\d{4}))?(?=$|[\\s,.!?])", "iu"));
  if (m){ const mon = MON.findIndex(x => new RegExp("^(?:" + x + ")", "i").test(m[2])); return fertig(m, tage(+m[1], mon, m[3] ? +m[3] : 0)); }
  m = text.match(/(?:^|\s)(?:am\s+|den\s+|zum\s+)?(\d{1,2})\.\s?(\d{1,2})\.(\d{4}|\d{2})?(?=$|[\s,.!?])/i);
  if (m) return fertig(m, tage(+m[1], +m[2] - 1, m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : 0));
  m = text.match(/(?:^|\s)(?:am|den|zum)\s+(\d{1,2})\.(?=$|\s)/i);
  if (m){ const tag = +m[1]; let d = tage(tag, today.getMonth(), today.getFullYear()); if (d === null || d < 0) d = tage(tag, (today.getMonth() + 1) % 12, today.getFullYear() + (today.getMonth() === 11 ? 1 : 0)); return fertig(m, d); }
  m = text.match(/(?:^|\s)in\s+(\d{1,3}|einem|einer|ein|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn)\s+(tag|tagen|woche|wochen)(?=$|[\s,.!?])/i);
  if (m){ const n = ZAHL[m[1].toLowerCase()] || +m[1]; return fertig(m, n * (/woche/i.test(m[2]) ? 7 : 1)); }
  m = text.match(/(?:^|\s)(?:nächste|naechste|kommende)\s+woche(?=$|[\s,.!?])/i);
  if (m) return fertig(m, 7);
  return null;
}

  const right = (i.task && !opts.noTick)
    ? `<button class="tick" data-id="${i.id}" aria-label="${isDone?"Zurückholen":"Abhaken"}: ${esc(i.t)}"><span>${isDone?"✓":""}</span></button>`
    : "<span></span>";
  const tag = isDone ? `<span class="donetag">✓ Erledigt</span>` : "";

  const inhalt = `${time}<span class="bar"></span><div class="t"><span class="txt">${esc(i.t)}</span>${nt}${tag}<span class="cal">${meta}</span></div>${right}`;

function dayView(d){

  const open = list.filter(i=>!done.has(i.id) && (!i.time || d>0 || mins(i.end||i.time) >= nowMin)).sort(byTime);
  const finished = list.filter(i=>done.has(i.id));
  const next = d===0 ? open.filter(i=>i.time).sort(byTime)[0] : null;
  const rest = open.filter(i=>i!==next);
  let html = "";
  if (next) html += `<div class="nextcard"><span class="bar" style="background:${calVar(next)}"></span><div><div class="lbl">Als Nächstes · ${next.time}${next.end?"–"+next.end:""}</div><div class="w">${esc(next.t)}</div><div class="m">${[CALS[next.cal].name, next.hint].filter(Boolean).join(" · ")}</div></div></div>`;
  if (!open.length){
    const nxt = items.filter(i=>i.d>d).sort((a,b)=>a.d-b.d)[0];
    html += `<div class="sect"><div class="listcard"><div class="empty">${d===0?"Heute steht nichts mehr an.":"Morgen ist frei. Genieß den Tag!"}${nxt?`<small>Danach: ${esc(nxt.t)}, ${fmtWd.format(dateOf(nxt.d))}</small>`:""}</div></div></div>`;
  } else if (rest.length){
    html += `<div class="sect"><div class="listcard"><ul class="list">${rest.map(i=>row(i)).join("")}</ul></div></div>`;
  }
  if (finished.length) html += `<div class="sect"><h2>${d===0?"Heute erledigt":"Erledigt"}</h2>${d===0?`<p class="cheer">Heute geschafft: ${finished.length} ${finished.length===1?"Ding":"Dinge"}</p>`:""}<div class="listcard"><ul class="list">${finished.map(i=>row(i)).join("")}</ul></div></div>`;
  return html;
}

let vorschlag = null, vOk = false;
const WTAG = ["sonntag","montag","dienstag","mittwoch","donnerstag","freitag","samstag"];
const IST_FRAGE = /^(was|wann|wo|wer|wie|welche[srnm]?|zeig(e)?|gibt es|habe ich|hab ich|muss ich|steht|stehen|such(e)?)\b/i;
function vorschlagAus(text){
  let t = " " + text.trim().replace(/[„“"]/g,"") + " ", d = 0; const l = t.toLowerCase();
  const dat = datumAus(t);
  if (dat){ t = " " + dat.t + " "; d = dat.d; }
  else if (/ übermorgen[ .,!?]/.test(l)) d = 2; else if (/ morgen[ .,!?]/.test(l)) d = 1;
  else { const w = WTAG.findIndex(x => l.includes(" " + x)); if (w >= 0) d = (w - today.getDay() + 7) % 7 || 7; }
  t = t.replace(/\s(am\s+)?(heute|übermorgen|morgen|sonntag|montag|dienstag|mittwoch|donnerstag|freitag|samstag)(?=[\s,.!?])/gi," ");
  t = t.replace(/^\s*(bitte\s+)?(trag(e)?\s+(mir\s+)?(bitte\s+)?ein:?|eintragen:?|notier(e)?:?|erinner(e)?\s+mich\s+(an|daran):?)\s*/i,"")
       .replace(/^\s*(ich\s+muss\s+(noch\s+)?|wir\s+müssen\s+(noch\s+)?|nicht\s+vergessen:?\s*)/i,"")
       .replace(/\bbitte\b/gi," ").replace(/[.!?]+\s*$/,"").replace(/\s+/g," ").trim();
  if (t) t = t.charAt(0).toUpperCase() + t.slice(1);
  return {text: t, d};
}

function kalenderDatei(titel, d){
  const f = x => x.getFullYear() + String(x.getMonth()+1).padStart(2,"0") + String(x.getDate()).padStart(2,"0");
  const tx = s => s.replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g," ");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const ev = [].concat(titel).flatMap((t, n) => ["BEGIN:VEVENT","UID:meintag-" + Date.now() + "-" + n + "@meintag","DTSTAMP:" + stamp,
    "DTSTART;VALUE=DATE:" + f(dateOf(d)),"DTEND;VALUE=DATE:" + f(dateOf(d+1)),"SUMMARY:" + tx(t),"END:VEVENT"]);
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MeinTag//DE","METHOD:PUBLISH", ...ev, "END:VCALENDAR"].join("\r\n");
}
function eintragen(auchApple){
  const text = (document.getElementById("vText")?.value || vorschlag.text).trim();
  const ps = teile(text, true);
  if (!ps.length){ vMsg = "Bitte erst einen Text eingeben."; vOk = false; return render(); }
  const d = vorschlag.d;
  // In der App speichern (jeder Teil einzeln) und sofort im passenden Kästchen zeigen (kein Apple-Fenster).
  const neu = ps.map(t => { let it = items.find(i => i.d === d && i.t.trim().toLowerCase() === t.toLowerCase());
    if (!it){ const e = {t, tag: tagKey(d)}; eigene.push(e); it = eigenesItem(e); items.push(it); }
    else {   // gab es schon (erledigt oder gelöscht): wieder als offenen Eintrag zeigen
      if (weg.has(it.id)){ weg.delete(it.id); wegSpeichern(); if (it.eigen) eigene.push({t: it.t, tag: tagKey(d)}); }
      if (done.has(it.id)){ done.delete(it.id); save(); }
    }
    return it; });
  eigeneSpeichern();
  merken();   // selbst eingetragen = schon gesehen
  const kasten = neu[0].cats[0] || OTHER.name;
  setView(d === 0 ? "heute" : d === 1 ? "morgen" : "danach");
  cat = ps.length === 1 ? kasten : null;   // bei mehreren: Kästchen-Übersicht zeigen, die Zahlen sind gestiegen
  vorschlag = null; frage = ""; vOk = true;
  vMsg = (ps.length === 1 ? "✓ „" + ps[0] + "“ steht jetzt unter " + kasten + "." : "✓ " + ps.length + " Einträge sind in ihre Kästchen einsortiert.") + (auchApple ? " Im Apple-Fenster „Hinzufügen“ tippen." : "");
  render();
  // Nur auf Wunsch: Kalender-Datei öffnen, das iPhone zeigt dann das Apple-Fenster „Hinzufügen“.
  if (auchApple) location.href = URL.createObjectURL(new Blob([kalenderDatei(ps, d)], {type:"text/calendar"}));
}
// Suche: jedes Wort einzeln, Reihenfolge egal, auch als Wortteil ("geburtstag" findet "Kindergeburtstag").
// Endungen wie in "Hermines" oder "Geschenke" stören nicht; kleine Füllwörter werden übersprungen.
const SUCH_FUELL = new Set("der die das den dem des ein eine einen einem einer für fuer von vom mit und oder am im in zu zum zur bei an auf".split(" "));
function passt(i, frage){
  const text = (i.t + " " + i.hint).toLowerCase();
  const ws = String(frage).toLowerCase().replace(/[.,!?„“"'’]/g," ").split(/\s+/).filter(w => w && !SUCH_FUELL.has(w));
  if (!ws.length) return false;
  return ws.every(w => text.includes(w) || [/(es|en|er|s|e|n)$/].some(rx => { const k = w.replace(rx, ""); return k.length >= 3 && k !== w && text.includes(k); }));
}
function setView(v){ view = v; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===v)); }
// Gesagtes verstehen: Tag + Kästchen, sonst Suche nach dem Wort.
const SPRACH_KAESTCHEN = [
  ["Einkauf", ["einkauf","einkaufen","einkaufsliste","kaufen","besorgen","shoppen"]],
  ["Geschenke", ["geschenk","geschenke","geburtstag","geburtstage"]],
  ["Kinder", ["kinder","kind","schule","kita"]],
  ["Unterlagen", ["unterlagen","papierkram","papiere","briefe","post"]],
  ["Arzt", ["arzt","ärzte","aerzte","doktor","arzttermin","arzttermine"]],
  ["Haushalt", ["haushalt","putzen"]],
  ["Treffen", ["treffen","verabredung","verabredungen","besuch","besuche"]],
  ["Für mich", ["für mich","fuer mich","mich selbst"]],
  ["Sonstiges", ["sonstiges","rest","andere"]],
];
const FUELL = new Set("was wann wo wer muss musst soll ich du wir habe hab hat ist sind steht stehen an noch heute morgen übermorgen danach später nächste nächsten woche bald bitte zeig zeige mir mal die der das den dem ein eine einen für fuer zu zum zur mit und oder termin termine liste los gibt es bei in im am alles alle".split(" "));
function verstehen(text){
  const l = " " + text.toLowerCase().normalize("NFC").replace(/[.,!?„“"]/g," ").replace(/\s+/g," ") + " ";
  let tag = null;
  if (/ (übermorgen|danach|später|nächste woche|nächsten woche|bald) /.test(l)) tag = "danach";
  else if (/ morgen /.test(l)) tag = "morgen";
  else if (/ heute /.test(l)) tag = "heute";
  const k = SPRACH_KAESTCHEN.find(([,ws]) => ws.some(w => l.includes(" " + w + " ")));
  if (k){ setView(tag || (view==="suchen" ? "heute" : view)); cat = k[0]; vMsg = ""; return render(); }
  const wort = l.trim().split(" ").filter(w => w && !FUELL.has(w)).join(" ");
  if (!wort && tag){ setView(tag); cat = null; vMsg = ""; return render(); }
  if (wort && items.some(i => !weg.has(i.id) && passt(i, wort))){ setView("suchen"); cat = null; q = wort; vMsg = ""; return render(); }
  const c = catsFor(wort || text)[0];
  if (c){ setView(tag || (view==="suchen" ? "heute" : view)); cat = c; vMsg = ""; return render(); }
  vMsg = "Das habe ich nicht verstanden. Versuch es noch einmal."; render();
}
function render(){
  if (!cat){ frisch.clear(); frischKey = ""; }
  const v = document.getElementById("view");
  let html = "";
  if (view==="heute"){ setHeader("Heute", 0); html += tilesHTML() + frageHTML() + (cat ? catView() : pickHint("heute")); }
  else if (view==="morgen"){ setHeader("Morgen", 1); html += tilesHTML() + frageHTML() + (cat ? catView() : pickHint("morgen")); }
  else if (view==="danach"){
    setHeader("Danach", null);
    html += tilesHTML() + frageHTML();
    html += cat ? catView() : pickHint("ab übermorgen");
  } else {
    setHeader("Suchen", null);
    html += `<input id="q" class="search" type="search" placeholder="Was suchst du? z. B. Turnbeutel" aria-label="Im Kalender suchen" value="${esc(q)}">`;
    if (q){
      const hits = items.filter(i=>!weg.has(i.id) && passt(i, q)).sort((a,b)=>a.d-b.d || byTime(a,b));
      html += hits.length
        ? `<div class="sect"><h2><small>Zum Löschen nach links wischen</small></h2><div class="listcard"><ul class="list">${hits.map(i=>row(i,{noTick:true, swipe:true, when: i.d===0?"Heute":i.d===1?"Morgen":fmtWd.format(dateOf(i.d))})).join("")}</ul></div></div>`
        : `<div class="sect"><div class="listcard"><div class="empty">Dazu habe ich nichts gefunden.<small>Versuch ein anderes Wort.</small></div></div></div>`;
    }
  }
  // Bildschirm bleibt beim Abhaken/Löschen genau dort stehen, wo er war (kein Springen nach oben).
  const y = window.scrollY; v.style.minHeight = v.offsetHeight + "px";
  v.innerHTML = html;
  window.scrollTo(0, y); requestAnimationFrame(() => { v.style.minHeight = ""; if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, Math.min(y, document.documentElement.scrollHeight - innerHeight)); });
  if (view==="suchen"){
    document.getElementById("q").addEventListener("input", e=>{ q = e.target.value.trim().toLowerCase(); render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  }
}
function loeschen(id){
  const it = items.find(i => i.id === id); if (!it) return;
  const n = it.eigen ? eigene.findIndex(e => "eigen:" + e.t + "@" + e.tag === id) : -1;
  const alt = n >= 0 ? eigene.splice(n, 1)[0] : null;
  weg.add(id); if (alt) eigeneSpeichern(); else wegSpeichern();
  rueck = () => { weg.delete(id); if (alt){ eigene.push(alt); eigeneSpeichern(); } wegSpeichern(); };
  lastDone = null; render(); toast("Gelöscht", true);
}
// Wischen: erledigten Eintrag nach links ziehen. Halb weg = löschen, ein Stück = roter Knopf "Löschen" bleibt stehen.
let zug = null;
function zugStart(ziel, x, y){ const r = ziel.closest && ziel.closest(".swrap .row"); if (!r || ziel.closest(".tick")) return;
  document.querySelectorAll(".swrap .row").forEach(o => { if (o !== r){ o.style.transform = ""; o.parentElement.classList.remove("auf"); } });
  zug = {r, x, y, dx: 0, an: false, start: r.style.transform ? -r.parentElement.querySelector(".del").offsetWidth : 0}; }
// Gibt true zurück, sobald wirklich seitlich gewischt wird (dann darf die Seite nicht mitscrollen).
function zugWeiter(x, y){ if (!zug) return false;
  const dx = x - zug.x, dy = y - zug.y;
  if (!zug.an){ if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)){ if (Math.abs(dy) > 12) zug = null; return false; }
    zug.an = true; zug.r.classList.add("zieht"); zug.r.parentElement.classList.add("auf"); }
  zug.dx = Math.min(0, zug.start + dx); zug.r.style.transform = "translateX(" + zug.dx + "px)"; return true; }
function zugEnde(){ if (!zug) return; const z = zug; zug = null; if (!z.an) return;
  z.r.classList.remove("zieht"); const w = z.r.offsetWidth, knopf = z.r.parentElement.querySelector(".del");
  if (-z.dx > w * 0.4){ z.r.style.transform = "translateX(-100%)"; setTimeout(() => loeschen(knopf.dataset.del), 160); }
  else if (-z.dx > 30) z.r.style.transform = "translateX(-" + knopf.offsetWidth + "px)";
  else { z.r.style.transform = ""; setTimeout(() => { if (!z.r.style.transform) z.r.parentElement.classList.remove("auf"); }, 200); } }
// iPhone: Finger (Touch-Ereignisse, damit Safari das Wischen sicher an die App gibt). Computer: Maus.
document.addEventListener("touchstart", ev => { const t = ev.touches[0]; if (ev.touches.length === 1) zugStart(ev.target, t.clientX, t.clientY); }, {passive: true});
document.addEventListener("touchmove", ev => { const t = ev.touches[0]; if (zugWeiter(t.clientX, t.clientY) && ev.cancelable) ev.preventDefault(); }, {passive: false});
document.addEventListener("touchend", zugEnde); document.addEventListener("touchcancel", zugEnde);
document.addEventListener("pointerdown", ev => { if (ev.pointerType === "mouse") zugStart(ev.target, ev.clientX, ev.clientY); });
document.addEventListener("pointermove", ev => { if (ev.pointerType === "mouse") zugWeiter(ev.clientX, ev.clientY); });
document.addEventListener("pointerup", ev => { if (ev.pointerType === "mouse") zugEnde(); });
function toast(text, undoable){
  const t = document.getElementById("toast");
  document.getElementById("toastText").textContent = text;
  document.getElementById("undo").hidden = !undoable;
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, 5000);
}
document.addEventListener("input", ev=>{ if (ev.target.id === "vText"){ const el = document.getElementById("vTeile"); if (el) el.innerHTML = teileHTML(ev.target.value); } });
document.addEventListener("submit", ev=>{
  if (ev.target.id !== "frageForm") return;
  ev.preventDefault();
  const inp = document.getElementById("frage"); const t = inp.value.trim(); inp.blur();
  if (!t){ vMsg = ""; return render(); }
  frage = t; vOk = false;
  if (IST_FRAGE.test(t)){ vorschlag = null; return verstehen(t); }
  vorschlag = vorschlagAus(t); vMsg = "";
  if (!vorschlag.text){ vorschlag = null; return verstehen(t); }
  render(); setTimeout(()=>document.querySelector(".vorschlag")?.scrollIntoView({block:"center", behavior:"smooth"}), 50);
});
document.addEventListener("click", ev=>{
  if (ev.target.closest("#vEintragen")){ eintragen(false); return; }
  if (ev.target.closest("#vApple")){ eintragen(true); return; }
  if (ev.target.closest("#vSuchen")){ const t = vorschlag ? (document.getElementById("vText")?.value || vorschlag.text) : frage; vorschlag = null; verstehen(t); return; }
  if (ev.target.closest("#vWeg")){ vorschlag = null; frage = ""; vMsg = ""; render(); return; }
  const vt = ev.target.closest(".vtag[data-vtag]"); if (vt && vorschlag){ vorschlag.text = document.getElementById("vText")?.value ?? vorschlag.text; vorschlag.d = +vt.dataset.vtag; render(); return; }
  const nb = ev.target.closest("nav button");
  if (nb){ view = nb.dataset.v; cat = null; vMsg = ""; frage = ""; vorschlag = null; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed", b===nb)); render(); window.scrollTo(0,0); if (view==="suchen") document.getElementById("q").focus(); return; }
  const tl = ev.target.closest(".tile,.catclose");
  if (tl){ cat = (cat===tl.dataset.cat) ? null : tl.dataset.cat; vMsg = "";
    if (cat) bestaetigen(items.filter(i => inView(i) && inCat(i, cat)));
    render(); return; }
  const tk = ev.target.closest(".tick");
  if (tk){
    const id = tk.dataset.id;
    if (done.has(id)){ done.delete(id); toast("Wieder offen", false); }
    else { done.add(id); frisch.add(id); lastDone = id; rueck = null; toast("✓ Erledigt", true); }
    save(); tk.blur(); render(); return;
  }
  if (ev.target.id==="undo" && rueck){ rueck(); rueck = null; render(); document.getElementById("toast").hidden = true; return; }
  const dl = ev.target.closest(".del[data-del]"); if (dl){ loeschen(dl.dataset.del); return; }
  if (ev.target.id==="undo" && lastDone){ done.delete(lastDone); lastDone = null; save(); render(); document.getElementById("toast").hidden = true; }
});
// Schrift wächst mit "Größere Schrift", aber höchstens bis 20 px Grundgröße (Standard 17 px), danach 3 px kleiner.
(function(){ const r = document.documentElement; const fs = parseFloat(getComputedStyle(r).fontSize) || 17; const cap = innerWidth < 375 ? 18 : 20; r.style.fontSize = (Math.min(fs, cap) - 3) + "px"; /* alles 3 px kleiner (Wunsch Nadim) */ })();
// Inhalt nie unter der unteren Leiste verstecken: Abstand folgt der echten Leistenhöhe (wächst mit der Schrift).
const navEl = document.querySelector("nav");

try { new ResizeObserver(setNavH).observe(navEl); } catch(_){} setNavH();
if (LIVE){ const ids = new Set(items.map(i => i.id)); let geaendert = false; weg.forEach(id => { if (!ids.has(id)){ weg.delete(id); geaendert = true; } }); if (geaendert) wegSpeichern(); }
if (!gesehen) merken();
render();
