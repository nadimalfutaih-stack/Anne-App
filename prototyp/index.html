<style>
/* Layout (kompakt): kleine Kopfzeile, "Heute" + roter Tageskreis + Datum in einer Reihe, schmale Karte "Als Nächstes", dichte Liste, vier Tasten unten. */
:root{ color-scheme:light;
  /* Farbe 2 "Salbei": immer hell, auch wenn das iPhone dunkel eingestellt ist */
  --bg:#EEF4EF; --card:#FFFFFF; --fg:#1D2A36; --muted:#56616C; --line:#DCE6DE;
  --next:#FFE7A3; --nav-on:#173653; --nav-on-fg:#FFFFFF; --nav:#FFFFFF; --nav-fg:#1D2A36;
  --today:#C62835; --sun:#FFD24A; --sun-bg:#173653;
  --next-lbl:#8A5A00;
  --cal-kalender:#C21878; --cal-privat:#006D73; --cal-arbeit:#BD590D; --cal-nadim:#245EB5;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
}

/* Auf dem iPhone folgt diese Grundschrift der Einstellung "Größere Schrift" (Standard 17 px).

html{font:-apple-system-body;font-family:var(--font)}
@supports not (font:-apple-system-body){html{font-size:17px}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1.059rem;line-height:1.35;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding-block:.75rem calc(var(--navh,6.5rem) + 1rem);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo{font-size:.82rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:.4rem .7rem;margin-bottom:.8rem}

.appbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.93rem;color:var(--muted)}
.brand svg{width:1.57rem;height:1.57rem;flex:none}
.calbtn{display:inline-flex;align-items:center;min-height:40px;padding:.3rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-weight:600;font-size:.9rem;text-decoration:none}

.titlebar{display:flex;align-items:center;flex-wrap:wrap;gap:.3rem .6rem;margin-top:.7rem}
h1{font-weight:800;font-size:min(1.857rem,9vw);letter-spacing:-.02em;line-height:1.1;margin:0}
.daycircle{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--today);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.96rem;font-variant-numeric:tabular-nums}
.sub{font-size:1.07rem;color:var(--muted);font-weight:400}
.greet{font-size:1.07rem;color:var(--fg);margin-top:.1rem;font-weight:600}

.nextcard{margin-top:.85rem;background:var(--next);border-radius:14px;padding:.7rem .85rem;display:grid;grid-template-columns:4px minmax(0,1fr);gap:.7rem}
.nextcard .bar{margin:0}
.nextcard .lbl{font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--next-lbl);font-variant-numeric:tabular-nums}
.nextcard .w{font-size:1.21rem;font-weight:700;line-height:1.2;margin-top:.05rem;overflow-wrap:anywhere}
.nextcard .m{font-size:.93rem;color:#6B5A33}

.sect{margin-top:.7rem}
.tilesec{margin-top:.75rem}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
.tile{font:inherit;text-align:left;cursor:pointer;background:var(--card);color:var(--fg);border:0;border-radius:13px;padding:.5rem .6rem;min-height:44px;display:grid;gap:.05rem;position:relative;box-shadow:0 1px 0 var(--line)}
.tile .ic{font-size:1.15rem;line-height:1.1}
.tile b{font-size:.93rem;font-weight:700}
.tile small{font-size:.8rem;color:var(--muted)}
.tile .n{position:absolute;top:.45rem;right:.5rem;font-size:.8rem;font-weight:700;color:#fff;background:var(--tc);border-radius:999px;min-width:1.4rem;height:1.4rem;display:grid;place-items:center;padding:0 .35rem;font-variant-numeric:tabular-nums}
.tile.on{outline:2.5px solid var(--nav-on);outline-offset:-2.5px}
/* Sprachknopf wie in der Wein-App: aus = Marineblau + Mikrofon, an = Gelb + Mikrofon mit Schallwellen, atmet, Ringe */
.voice{display:grid;justify-items:center;gap:.35rem;margin-top:1rem}
.mikro{position:relative;width:5.6rem;height:5.6rem;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;
  background:var(--nav-on);color:#fff;box-shadow:inset 0 0 0 3px var(--nav-on),inset 0 0 0 4px rgba(255,210,74,.55),0 10px 24px rgba(23,54,83,.28);transition:background .2s,color .2s,transform .12s}
.mikro svg{width:2.3rem;height:2.3rem;fill:currentColor}
.mikro:active{transform:scale(.96)}
.mikro::before,.mikro::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #E0A800;opacity:0;pointer-events:none}
.mikro.an{background:#FFD24A;color:var(--nav-on);box-shadow:inset 0 0 0 3px #FFD24A,inset 0 0 0 4px rgba(23,54,83,.35),0 10px 26px rgba(224,168,0,.45);animation:atmen 2.4s ease-in-out infinite}
.mikro.an::before{animation:ring 2.4s ease-out infinite}
.mikro.an::after{animation:ring 2.4s ease-out 1.2s infinite}
@keyframes atmen{50%{transform:scale(1.04)}}
@keyframes ring{0%{inset:0;opacity:.9}100%{inset:-1.7rem;opacity:0}}
.voice.klein .mikro{width:3.8rem;height:3.8rem}.voice.klein .mikro svg{width:1.6rem;height:1.6rem}.voice.klein{margin-top:.6rem}
.vhint{font-size:.93rem;font-weight:600;color:var(--muted);text-align:center;min-height:1.3em;display:flex;align-items:center;gap:.4rem}
.vhint.an{color:#8A5A00}
.vhint.an::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:#C62835}
.gesagt{font-size:.93rem;font-style:italic;background:var(--card);border-radius:999px;padding:.25rem .8rem;max-width:100%;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.mikro.an,.mikro.an::before,.mikro.an::after{animation:none}.mikro.an::before{opacity:1;inset:-.5rem}}
.entwurf{margin-top:.8rem;background:var(--card);border-radius:14px;padding:.85rem;display:grid;gap:.55rem}
.entwurf label{font-size:.86rem;color:var(--muted);font-weight:600}
.entwurf .search{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{font:inherit;font-size:.9rem;font-weight:600;min-height:40px;padding:.3rem .9rem;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.chip.on{background:var(--nav-on);border-color:var(--nav-on);color:#fff}
.vbtns{display:grid;gap:.45rem}
.vbtn{font:inherit;font-size:1rem;font-weight:700;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.vbtn.haupt{background:var(--nav-on);border-color:var(--nav-on);color:#fff}
.vbtn.leise{border:0;background:none;color:var(--muted);font-weight:600;min-height:44px}
.pick{margin-top:.9rem;display:flex;gap:.7rem;align-items:center;background:var(--card);border-radius:14px;padding:.85rem 1rem}
.pick span{font-size:1.4rem}
.pick b{display:block;font-size:1rem}
.pick small{display:block;color:var(--muted);font-size:.9rem}
.cathead{display:flex;align-items:center;gap:.6rem;margin-top:.9rem;flex-wrap:wrap}
.cathead h2{margin:0;font-size:1.3rem;font-weight:800}
.cathead span{color:var(--muted);font-size:.93rem}
.catclose{margin-left:auto;font:inherit;font-size:.9rem;font-weight:600;min-height:40px;padding:.3rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.sect h2{font-size:1.059rem;font-weight:700;margin:0 0 .45rem .2rem}
.listcard{background:var(--card);border-radius:14px;overflow:hidden}
.list{list-style:none;margin:0;padding:0}
.row{padding-left:.85rem !important;padding-right:.85rem !important;display:grid;grid-template-columns:3.6rem 4px minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--line);min-height:3.43rem}
.row:last-child{border-bottom:0}
.time{font-variant-numeric:tabular-nums;font-size:.93rem;font-weight:400;line-height:1.25;white-space:nowrap}
.time small{display:block;font-size:.941rem;font-weight:400;color:var(--muted)}
.time.allday{font-size:.86rem;font-weight:400;color:var(--fg)}
.bar{align-self:stretch;margin-block:.15rem;border-radius:3px;background:var(--c)}
.t{font-size:1.07rem;font-weight:600;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.cal{display:block;font-size:.86rem;font-weight:400;color:var(--muted);margin-top:.05rem}
.tick{width:2.6rem;height:2.6rem;min-width:44px;min-height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--card);font-size:1.05rem;font-weight:800;position:relative}
.tick::before{content:"";position:absolute;inset:.55rem;border-radius:50%;border:2px solid var(--fg)}
.tick span{position:relative}
.row>.tick{margin-right:-.4rem}
.done .tick::before{background:var(--fg)}
.done .t{color:var(--muted)}
.done .t .txt{text-decoration:line-through}
.done .bar{opacity:.35}
.donetag{display:block;font-size:.941rem;font-weight:700;color:var(--fg)}
.empty{padding:1rem 0}
.empty small{display:block;color:var(--muted);font-size:.941rem;margin-top:.25rem}
.cheer{font-weight:600;font-size:.941rem;margin:0 0 .45rem .2rem;color:var(--muted)}
.search{width:100%;font:inherit;font-size:1.176rem;min-height:52px;padding:.7rem 1rem;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);margin-top:1.1rem}

nav{container:nav/inline-size}
@container nav (max-width:16.8rem){nav div{grid-template-columns:repeat(2,minmax(0,1fr))}}
nav button{font:inherit;font-size:.96rem;font-weight:600;min-height:44px;padding:.5rem .15rem;border-radius:12px;border:0;background:var(--nav);color:var(--nav-fg);cursor:pointer}
nav button[aria-pressed="true"]{background:var(--nav-on);color:var(--nav-on-fg)}
button:focus-visible,.tile:focus-visible,.search:focus-visible,.calbtn:focus-visible{outline:3px solid var(--nav-on);outline-offset:2px}

.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--navh,5.4rem) + .5rem);background:var(--nav-on);color:var(--nav-on-fg);border-radius:999px;padding:.25rem .25rem .25rem 1rem;display:flex;gap:.5rem;align-items:center;font-size:.941rem;font-weight:600;white-space:nowrap;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{font:inherit;font-weight:700;min-height:44px;background:var(--card);color:var(--fg);border:0;border-radius:999px;padding:.3rem .9rem;cursor:pointer}
/* Schmaler Bildschirm oder sehr große Schrift: Uhrzeit rückt über den Titel, damit der Titel die volle Breite bekommt. */
.listcard{container:list/inline-size}
@container list (max-width:18rem){
  .row{grid-template-columns:6px minmax(0,1fr) auto;grid-template-areas:"bar time tick" "bar t tick";row-gap:.15rem;gap:.15rem .75rem}
  .row>.time{grid-area:time} .row>.bar{grid-area:bar} .row>.t{grid-area:t} .row>:last-child{grid-area:tick}
}
@media (max-width:360px){.listcard{padding:0 .75rem}}

function parseDate(v){

  if (/^\d{4}-\d{2}-\d{2}/.test(v)) return new Date(v);

function readShortcutData(){
  const m = location.hash.match(/^#d=(.+)$/);

  try {
    let b = decodeURIComponent(m[1]).replace(/-/g,"+").replace(/_/g,"/").replace(/\s/g,"");

    const text = new TextDecoder().decode(Uint8Array.from(atob(b), c=>c.charCodeAt(0)));
    const t0 = new Date(); t0.setHours(0,0,0,0);
    const hm = d => String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    STATS.chars = text.length;
    const rows = text.split(/\r?\n/).map(l=>{ const sep = l.includes("|") ? "|" : ";"; const p = l.split(sep); while (p.length > 5) { p[1] = p[0] + sep + p[1]; p.shift(); } return p; }).filter(p=>p.length>=5 && p[0].trim());
    STATS.lines = rows.length;
    const out = rows.map(p=>{
      const [t, s, e, ad, cal] = p.map(x=>x.trim());
      if (!STATS.sampleStart) STATS.sampleStart = s;
      if (!STATS.cals.includes(cal)) STATS.cals.push(cal);
      const start = parseDate(s), end = parseDate(e);
      if (isNaN(start)) return null;
      STATS.dates++;
      const day = new Date(start); day.setHours(0,0,0,0);
      const allDay = /^(ja|yes|true|1|wahr)$/i.test(ad);
      return { t, d: Math.round((day - t0) / 864e5), time: allDay ? undefined : hm(start), end: allDay || isNaN(end) ? undefined : hm(end), cal: calKey(cal), key: t + "@" + s };
    }).filter(x=>x && x.d >= 0 && SHOW_CALS.includes(x.cal));

const items = EXAMPLES.map((e,i)=>{ const cats = catsFor(e.t); return {...e, id: e.key || "e"+i, cats, hint: cats.join(" · "), task: !e.time && !/geburtstag/i.test(e.t)}; });

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem("meintag-done")||"[]")); } catch(_){}
const save = () => { try { localStorage.setItem("meintag-done", JSON.stringify([...done])); } catch(_){} };

let view = "heute", q = "", lastDone = null, toastTimer = null, cat = null;
const inCat = (i, name) => name === OTHER.name ? !i.cats.length : i.cats.includes(name);
// Kacheln zeigen nur die Einträge der gewählten Ansicht: Heute = heute (ohne vorbei), Morgen = morgen, Danach = ab übermorgen.
const inView = i => view==="morgen" ? i.d===1 : view==="danach" ? i.d>1 : (i.d===0 && (!i.time || mins(i.end||i.time) >= nowMin));
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins = t => { const [a,b] = t.split(":").map(Number); return a*60+b; };
const byTime = (a,b) => (a.time?1:0)-(b.time?1:0) || (a.time||"").localeCompare(b.time||"");
const calVar = i => `var(${CALS[i.cal].v})`;

function row(i, opts={}){
  const isDone = done.has(i.id);
  const time = i.time ? `<div class="time">${i.time}</div>` : `<div class="time allday">ganztägig</div>`;
  const meta = [opts.when, CALS[i.cal].name, opts.noHint ? "" : i.hint].filter(Boolean).join(" · ");
  const right = (i.task && !opts.noTick)
    ? `<button class="tick" data-id="${i.id}" aria-label="${isDone?"Zurückholen":"Abhaken"}: ${esc(i.t)}"><span>${isDone?"✓":""}</span></button>`
    : "<span></span>";
  const tag = isDone ? `<span class="donetag">✓ Erledigt</span>` : "";
  return `<li class="row${isDone?" done":""}" style="--c:${calVar(i)}">${time}<span class="bar"></span><div class="t"><span class="txt">${esc(i.t)}</span>${tag}<span class="cal">${meta}</span></div>${right}</li>`;
}
function dayView(d){
  const list = items.filter(i=>i.d===d);
  const open = list.filter(i=>!done.has(i.id) && (!i.time || d>0 || mins(i.end||i.time) >= nowMin)).sort(byTime);
  const finished = list.filter(i=>done.has(i.id));
  const next = d===0 ? open.filter(i=>i.time).sort(byTime)[0] : null;
  const rest = open.filter(i=>i!==next);
  let html = "";
  if (next) html += `<div class="nextcard"><span class="bar" style="background:${calVar(next)}"></span><div><div class="lbl">Als Nächstes · ${next.time}${next.end?"–"+next.end:""}</div><div class="w">${esc(next.t)}</div><div class="m">${[CALS[next.cal].name, next.hint].filter(Boolean).join(" · ")}</div></div></div>`;
  if (!open.length){
    const nxt = items.filter(i=>i.d>d).sort((a,b)=>a.d-b.d)[0];
    html += `<div class="sect"><div class="listcard"><div class="empty">${d===0?"Heute steht nichts mehr an.":"Morgen ist frei. Genieß den Tag!"}${nxt?`<small>Danach: ${esc(nxt.t)}, ${fmtWd.format(dateOf(nxt.d))}</small>`:""}</div></div></div>`;
  } else if (rest.length){
    html += `<div class="sect"><div class="listcard"><ul class="list">${rest.map(i=>row(i)).join("")}</ul></div></div>`;
  }
  if (finished.length) html += `<div class="sect"><h2>${d===0?"Heute erledigt":"Erledigt"}</h2>${d===0?`<p class="cheer">Heute geschafft: ${finished.length} ${finished.length===1?"Ding":"Dinge"}</p>`:""}<div class="listcard"><ul class="list">${finished.map(i=>row(i)).join("")}</ul></div></div>`;
  return html;
}
function setHeader(title, d){
  document.getElementById("title").textContent = title;
  const c = document.getElementById("circle");
  c.hidden = d !== 0; c.textContent = today.getDate();
  document.getElementById("sub").textContent = d === null ? "" : fmtHead.format(dateOf(d));
  document.getElementById("hello").hidden = d !== 0;
}
function tilesHTML(){
  return `<div class="tilesec"><div class="tiles">${TILES.map(t=>{
    const open = items.filter(i=>inView(i) && inCat(i, t.name) && !done.has(i.id));
    const first = open.slice().sort((a,b)=>a.d-b.d || byTime(a,b))[0];
    const when = !first ? "nichts offen" : first.d===0 ? "heute" : first.d===1 ? "morgen" : "ab " + fmtShortDay.format(dateOf(first.d));
    return `<button class="tile${cat===t.name?" on":""}" data-cat="${t.name}" style="--tc:${t.color}" aria-pressed="${cat===t.name}"><span class="ic" aria-hidden="true">${t.icon}</span><b>${t.name}</b><small>${when}</small>${open.length?`<span class="n">${open.length}</span>`:""}</button>`;
  }).join("")}</div></div>`;
}
function catView(){
  const t = TILES.find(x=>x.name===cat);
  const list = items.filter(i=>inView(i) && inCat(i, cat)).sort((a,b)=>a.d-b.d || byTime(a,b));
  const open = list.filter(i=>!done.has(i.id)), fin = list.filter(i=>done.has(i.id));
  const when = i => i.d>1 ? fmtWd.format(dateOf(i.d)) : "";
  let html = `<div class="cathead"><h2>${t.icon} ${t.name}</h2><span>${open.length} offen</span><button class="catclose" data-cat="${t.name}">Alle zeigen</button></div>`;
  html += open.length
    ? `<div class="sect"><div class="listcard"><ul class="list">${open.map(i=>row({...i, task:true},{when:when(i), noHint:true})).join("")}</ul></div></div>`
    : `<div class="sect"><div class="listcard"><div class="empty">${fin.length ? "Alles erledigt. Schön!" : "Hier steht nichts an."}</div></div></div>`;
  if (fin.length) html += `<div class="sect"><h2>Erledigt</h2><div class="listcard"><ul class="list">${fin.map(i=>row({...i, task:true},{when:when(i), noHint:true})).join("")}</ul></div></div>`;
  return html;
}
function pickHint(when){
  const n = items.filter(i=>inView(i) && !done.has(i.id)).length;
  return `<div class="pick"><span aria-hidden="true">☝️</span><div><b>Tippe oben auf eine Liste.</b><small>${n ? `Dann siehst du, was ${when} ansteht.` : `Für ${when} steht nichts im Kalender.`}</small></div></div>`;
}
// ---------- Sprachknopf ----------
const MIC_AUS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>';
const MIC_AN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a2.5 2.5 0 0 0 2.5-2.5v-5a2.5 2.5 0 0 0-5 0v5A2.5 2.5 0 0 0 10 13zm4.2-2.5a4.2 4.2 0 0 1-8.4 0H4.2a5.8 5.8 0 0 0 5 5.75V19h1.6v-2.75a5.8 5.8 0 0 0 5-5.75h-1.6z"/><path d="M17.4 7.2a5 5 0 0 1 0 6.6l1.15 1.05a6.6 6.6 0 0 0 0-8.7zM19.7 4.9a8.3 8.3 0 0 1 0 11.2l1.15 1.05a9.9 9.9 0 0 0 0-13.3z"/></svg>';
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let hoert = false, gesagt = "", vMsg = "", nutzerAn = false, basis = "", entwurf = null;
// Eintragen per Sprache ist auf Standby, bis der Kurzbefehl "Eintragen" fertig ist. Auf true stellen, um die Eintragen-Karte wieder zu zeigen.
const EINTRAGEN_AKTIV = false;
const T_BEREIT = "Tippen und sprechen", T_HOERT = "Ich höre zu … Tippen zum Stoppen";
function voiceHTML(){
  const msg = hoert ? T_HOERT : (vMsg || (entwurf ? "Stimmt der Text? Dann eintragen." : T_BEREIT));
  return `<div class="voice${cat && !hoert && !entwurf ? " klein" : ""}"><button id="mikro" class="mikro${hoert ? " an" : ""}" aria-pressed="${hoert}" aria-label="${hoert ? "Zuhören beenden" : "Sprechen"}">${hoert ? MIC_AN : MIC_AUS}</button>
    <div class="vhint${hoert ? " an" : ""}" role="status">${esc(msg)}</div>${hoert && gesagt ? `<div class="gesagt">„${esc(gesagt)}“</div>` : ""}</div>${entwurf && !hoert ? entwurfHTML() : ""}`;
}
// ---------- Eintragen-Karte ----------
const WTAG = ["sonntag","montag","dienstag","mittwoch","donnerstag","freitag","samstag"];
const BEFEHL = /^(bitte\s+)?(trag(e)?\s+(mir\s+)?(bitte\s+)?(ein|ein:)|eintragen|notier(e)?|merk(e)?\s+dir|schreib(e)?\s+(auf|ein)|erinner(e)?\s+mich\s+(an|daran)|tipp(e)?(\s+ein)?)\s*:?\s*/i;
function entwurfAus(text){
  let t = " " + text.trim().replace(/[„“"]/g,"") + " ";
  let d = 0; const l = t.toLowerCase();
  if (/ übermorgen /.test(l)) d = 2; else if (/ morgen /.test(l)) d = 1;
  else { const w = WTAG.findIndex(x => l.includes(" " + x) || l.includes(" am " + x)); if (w >= 0){ const heute = today.getDay(); d = (w - heute + 7) % 7 || 7; } }
  t = t.replace(/\s(am\s+)?(heute|übermorgen|morgen|sonntag|montag|dienstag|mittwoch|donnerstag|freitag|samstag)(?=[\s,.!?])/gi," ");
  t = t.trim().replace(BEFEHL,"").replace(/^(ich\s+muss\s+(noch\s+)?|wir\s+müssen\s+(noch\s+)?|nicht\s+vergessen:?\s*)/i,"").replace(/[.!?]+$/,"").replace(/\s+/g," ").trim();
  if (t) t = t.charAt(0).toUpperCase() + t.slice(1);
  const frage = /^(was|wann|wo|wer|welche|zeig|gibt es|habe ich|hab ich|muss ich)\b/i.test(text.trim());
  return {text: t, d, frage, roh: text};
}
const fmtChip = new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"numeric",month:"short"});
function entwurfHTML(){
  const e = entwurf;
  const chips = [[0,"Heute"],[1,"Morgen"],[2,"Übermorgen"]];
  if (e.d > 2) chips.push([e.d, fmtChip.format(dateOf(e.d))]);
  const eintragen = `<button class="vbtn haupt" id="eintragen">📅 In den Kalender eintragen</button>`;
  const anzeigen = `<button class="vbtn${e.frage ? " haupt" : ""}" id="anzeigen">Nur anzeigen</button>`;
  return `<div class="entwurf"><label for="eText">Das hast du gesagt:</label>
    <input id="eText" class="search" value="${esc(e.text)}" aria-label="Eintrag">
    <div class="chips" role="group" aria-label="Tag">${chips.map(([d,n])=>`<button class="chip${d===e.d?" on":""}" data-tag="${d}" aria-pressed="${d===e.d}">${n}</button>`).join("")}</div>
    <div class="vbtns">${e.frage ? anzeigen + eintragen : eintragen + anzeigen}<button class="vbtn leise" id="verwerfen">Verwerfen</button></div></div>`;
}
function eintragen(){
  const t = (document.getElementById("eText")?.value || entwurf.text).trim();
  if (!t){ vMsg = "Bitte erst einen Text eingeben."; return render(); }
  // Statt eines Datums wird die Zahl der Tage ab heute geschickt (0 = heute, 1 = morgen …); der Kurzbefehl rechnet "Aktuelles Datum + Tage".
  const url = "shortcuts://run-shortcut?name=" + encodeURIComponent("Eintragen") + "&input=text&text=" + encodeURIComponent(t.replace(/;/g, ",") + ";" + entwurf.d);
  entwurf = null; vMsg = "„" + t + "“ wird eingetragen …"; render();
  location.href = url;
}
function setView(v){ view = v; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===v)); }
// Gesagtes verstehen: Tag + Kästchen, sonst Suche nach dem Wort.
const SPRACH_KAESTCHEN = [
  ["Einkauf", ["einkauf","einkaufen","einkaufsliste","kaufen","besorgen","shoppen"]],
  ["Geschenke", ["geschenk","geschenke","geburtstag","geburtstage"]],
  ["Kinder", ["kinder","kind","schule","kita"]],
  ["Unterlagen", ["unterlagen","papierkram","papiere","briefe","post"]],
  ["Arzt", ["arzt","ärzte","aerzte","doktor","arzttermin","arzttermine"]],
  ["Haushalt", ["haushalt","putzen"]],
  ["Treffen", ["treffen","verabredung","verabredungen","besuch","besuche"]],
  ["Für mich", ["für mich","fuer mich","mich selbst"]],
  ["Sonstiges", ["sonstiges","rest","andere"]],
];
const FUELL = new Set("was wann wo wer muss musst soll ich du wir habe hab hat ist sind steht stehen an noch heute morgen übermorgen danach später nächste nächsten woche bald bitte zeig zeige mir mal die der das den dem ein eine einen für fuer zu zum zur mit und oder termin termine liste los gibt es bei in im am alles alle".split(" "));
function verstehen(text){
  const l = " " + text.toLowerCase().normalize("NFC").replace(/[.,!?„“"]/g," ").replace(/\s+/g," ") + " ";
  let tag = null;
  if (/ (übermorgen|danach|später|nächste woche|nächsten woche|bald) /.test(l)) tag = "danach";
  else if (/ morgen /.test(l)) tag = "morgen";
  else if (/ heute /.test(l)) tag = "heute";
  const k = SPRACH_KAESTCHEN.find(([,ws]) => ws.some(w => l.includes(" " + w + " ")));
  if (k){ setView(tag || (view==="suchen" ? "heute" : view)); cat = k[0]; vMsg = ""; return render(); }
  const wort = l.trim().split(" ").filter(w => w && !FUELL.has(w)).join(" ");
  if (!wort && tag){ setView(tag); cat = null; vMsg = ""; return render(); }
  if (wort && items.some(i => i.t.toLowerCase().includes(wort) || i.hint.toLowerCase().includes(wort))){ setView("suchen"); cat = null; q = wort; vMsg = ""; return render(); }
  const c = catsFor(wort || text)[0];
  if (c){ setView(tag || (view==="suchen" ? "heute" : view)); cat = c; vMsg = ""; return render(); }
  vMsg = "Das habe ich nicht verstanden. Versuch es noch einmal."; render();
}
let erkennung = null;
if (SR){
  erkennung = new SR(); erkennung.lang = "de-DE"; erkennung.interimResults = true; erkennung.continuous = true; erkennung.maxAlternatives = 1;
  let endText = "";
  const zusammen = (...t) => t.filter(Boolean).join(" ").replace(/\s+/g," ").trim();
  erkennung.onstart = () => { hoert = true; endText = ""; vMsg = ""; render(); };
  erkennung.onresult = ev => { let zw = ""; for (let i = ev.resultIndex; i < ev.results.length; i++){ const r = ev.results[i]; if (r.isFinal) endText += " " + r[0].transcript; else zw += r[0].transcript; }
    gesagt = zusammen(basis, endText, zw); const g = document.querySelector(".gesagt"); if (g) g.textContent = "„" + gesagt + "“"; else render(); };
  erkennung.onerror = ev => { if (ev.error === "not-allowed" || ev.error === "service-not-allowed"){ nutzerAn = false; vMsg = "Mikrofon ist gesperrt. Bitte in den Einstellungen erlauben."; }
    else if (ev.error !== "no-speech" && ev.error !== "aborted"){ nutzerAn = false; vMsg = "Spracheingabe geht gerade nicht. Bitte oben ein Kästchen antippen."; } };
  // Das iPhone beendet die Erkennung manchmal selbst: solange Anne nicht ausgeschaltet hat, sofort neu starten.
  erkennung.onend = () => {
    basis = gesagt;
    if (nutzerAn){ try { erkennung.start(); return; } catch(_){ setTimeout(()=>{ try { erkennung.start(); } catch(_){} }, 250); return; } }
    hoert = false;
    if (gesagt && EINTRAGEN_AKTIV){ entwurf = entwurfAus(gesagt); }
    else if (gesagt){ const g = gesagt; gesagt = ""; return verstehen(g); }
    render();
    if (entwurf) setTimeout(()=>document.querySelector(".entwurf")?.scrollIntoView({block:"center", behavior:"smooth"}), 50);
  };
}
function mikroTippen(){
  if (!erkennung){ vMsg = "Spracheingabe geht hier nicht. Bitte oben ein Kästchen antippen."; return render(); }
  if (hoert || nutzerAn){ nutzerAn = false; try { erkennung.stop(); } catch(_){} return; }
  nutzerAn = true; basis = ""; gesagt = ""; entwurf = null;
  try { erkennung.start(); } catch(_){ /* läuft schon */ }
}
function render(){
  const v = document.getElementById("view");
  let html = "";
  if (view==="heute"){ setHeader("Heute", 0); html += tilesHTML() + voiceHTML() + (cat ? catView() : pickHint("heute")); }
  else if (view==="morgen"){ setHeader("Morgen", 1); html += tilesHTML() + voiceHTML() + (cat ? catView() : pickHint("morgen")); }
  else if (view==="danach"){
    setHeader("Danach", null);
    html += tilesHTML() + voiceHTML();
    html += cat ? catView() : pickHint("ab übermorgen");
  } else {
    setHeader("Suchen", null);
    html += `<input id="q" class="search" type="search" placeholder="Was suchst du? z. B. Turnbeutel" aria-label="Im Kalender suchen" value="${esc(q)}">` + voiceHTML();
    if (q){
      const hits = items.filter(i=>i.t.toLowerCase().includes(q) || i.hint.toLowerCase().includes(q)).sort((a,b)=>a.d-b.d || byTime(a,b));
      html += hits.length
        ? `<div class="sect"><div class="listcard"><ul class="list">${hits.map(i=>row(i,{noTick:true, when: i.d===0?"Heute":i.d===1?"Morgen":fmtWd.format(dateOf(i.d))})).join("")}</ul></div></div>`
        : `<div class="sect"><div class="listcard"><div class="empty">Dazu habe ich nichts gefunden.<small>Versuch ein anderes Wort.</small></div></div></div>`;
    }
  }
  v.innerHTML = html;
  if (view==="suchen"){
    document.getElementById("q").addEventListener("input", e=>{ q = e.target.value.trim().toLowerCase(); render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  }
}
function toast(text, undoable){
  const t = document.getElementById("toast");
  document.getElementById("toastText").textContent = text;
  document.getElementById("undo").hidden = !undoable;
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, 5000);
}
document.addEventListener("click", ev=>{
  if (ev.target.closest("#mikro")){ mikroTippen(); return; }
  if (ev.target.closest("#eintragen")){ eintragen(); return; }
  if (ev.target.closest("#anzeigen")){ const t = document.getElementById("eText")?.value || entwurf.roh; entwurf = null; gesagt = ""; verstehen(t); return; }
  if (ev.target.closest("#verwerfen")){ entwurf = null; gesagt = ""; vMsg = ""; render(); return; }
  const ch = ev.target.closest(".chip[data-tag]"); if (ch && entwurf){ entwurf.text = document.getElementById("eText")?.value ?? entwurf.text; entwurf.d = +ch.dataset.tag; render(); return; }
  const nb = ev.target.closest("nav button");
  if (nb){ view = nb.dataset.v; cat = null; vMsg = ""; gesagt = ""; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed", b===nb)); render(); window.scrollTo(0,0); if (view==="suchen") document.getElementById("q").focus(); return; }
  const tl = ev.target.closest(".tile,.catclose");
  if (tl){ cat = (cat===tl.dataset.cat) ? null : tl.dataset.cat; vMsg = ""; gesagt = ""; render(); return; }
  const tk = ev.target.closest(".tick");
  if (tk){
    const id = tk.dataset.id;
    if (done.has(id)){ done.delete(id); toast("Wieder offen", false); }
    else { done.add(id); lastDone = id; toast("✓ Erledigt", true); }
    save(); render(); return;
  }
  if (ev.target.id==="undo" && lastDone){ done.delete(lastDone); lastDone = null; save(); render(); document.getElementById("toast").hidden = true; }
});
// Schrift wächst mit "Größere Schrift", aber höchstens bis 20 px Grundgröße (Standard 17 px), danach 3 px kleiner.
(function(){ const r = document.documentElement; const fs = parseFloat(getComputedStyle(r).fontSize) || 17; const cap = innerWidth < 375 ? 18 : 20; r.style.fontSize = (Math.min(fs, cap) - 3) + "px"; /* alles 3 px kleiner (Wunsch Nadim) */ })();
// Inhalt nie unter der unteren Leiste verstecken: Abstand folgt der echten Leistenhöhe (wächst mit der Schrift).
const navEl = document.querySelector("nav");
const setNavH = () => document.documentElement.style.setProperty("--navh", navEl.getBoundingClientRect().height + "px");
try { new ResizeObserver(setNavH).observe(navEl); } catch(_){} setNavH();
render();
</script>
