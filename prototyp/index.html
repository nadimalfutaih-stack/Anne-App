<title>Mein Tag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: wie Annes Apple-Kalender – großer fetter Titel mit rotem Tageskreis, Liste mit Uhrzeit links und Kalenderfarbe als Streifen, Pillen-Knöpfe unten. Nur größer. */
:root{
  --bg:#ffffff; --fg:#000000; --muted:#8a8a8e; --line:#e5e5ea; --fill:#f2f2f7;
  --red:#ff3b30; --glass:rgba(249,249,251,.82); --glass-line:rgba(0,0,0,.12);
  --cal-kalender:#c03fd0; --cal-privat:#2c8bab; --cal-arbeit:#e0782a; --cal-nadim:#1f7cf0;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --fg:#ffffff; --muted:#98989f; --line:#2c2c2e; --fill:#1c1c1e;
  --red:#ff453a; --glass:rgba(30,30,32,.8); --glass-line:rgba(255,255,255,.14);
  --cal-kalender:#d86ae6; --cal-privat:#4fb0d0; --cal-arbeit:#f0954d; --cal-nadim:#4a9bff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#ffffff; --muted:#98989f; --line:#2c2c2e; --fill:#1c1c1e;
  --red:#ff453a; --glass:rgba(30,30,32,.8); --glass-line:rgba(255,255,255,.14);
  --cal-kalender:#d86ae6; --cal-privat:#4fb0d0; --cal-arbeit:#f0954d; --cal-nadim:#4a9bff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:19px;line-height:1.35;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo{font-size:14px;color:var(--muted);background:var(--fill);border-radius:12px;padding:8px 12px;margin-bottom:14px}
.greet{font-size:17px;color:var(--muted);font-weight:500}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
h1{font-family:var(--font-display);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1.1;margin:0}
.daycircle{flex:none;width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.daycircle.off{background:transparent;color:var(--fg);border:2px solid var(--line)}
.sub{font-size:17px;color:var(--muted);margin-top:2px}
.checked{font-size:14px;color:var(--muted);margin-top:4px}
.next{margin-top:18px;border-radius:16px;padding:14px 16px;background:var(--fill);display:grid;grid-template-columns:5px 1fr;gap:14px}
.next .bar{border-radius:3px;background:var(--c)}
.next .lbl{font-size:15px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.04em}
.next .what{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.2}
.next .tm{font-size:19px;color:var(--muted);font-weight:600;margin-top:2px}
.sect{margin-top:26px}
.sect h2{font-size:15px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sect h2.day{font-size:20px;color:var(--fg);text-transform:none;letter-spacing:0;font-weight:700}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:72px 5px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);min-height:64px}
.time{font-variant-numeric:tabular-nums;font-size:17px;font-weight:600;line-height:1.25}
.time small{display:block;font-size:15px;font-weight:400;color:var(--muted)}
.time.allday{font-size:15px;font-weight:500;color:var(--muted)}
.bar{align-self:stretch;border-radius:3px;background:var(--c)}
.t{min-width:0;overflow-wrap:anywhere;font-weight:600}
.cal{display:block;font-size:15px;font-weight:400;color:var(--muted)}
.tick{width:38px;height:38px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;padding:0}
.done .tick{background:var(--red);border-color:var(--red)}
.done .t{color:var(--muted);text-decoration:line-through}
.done .bar{opacity:.35}
.empty{padding:16px 0;color:var(--fg);border-bottom:1px solid var(--line)}
.empty small{display:block;color:var(--muted);font-size:16px;margin-top:4px}
.cheer{color:var(--red);font-weight:600;font-size:17px;margin:10px 0 0}
.search{width:100%;font:inherit;padding:12px 16px;border-radius:12px;border:0;background:var(--fill);color:var(--fg);margin-top:18px}
nav{position:fixed;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
nav div{pointer-events:auto;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 6px 24px rgba(0,0,0,.12)}
nav button{font:inherit;font-size:17px;font-weight:600;padding:13px 2px;border-radius:999px;border:0;background:transparent;color:var(--fg);cursor:pointer}
nav button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible,.search:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:999px;padding:10px 10px 10px 20px;display:flex;gap:10px;align-items:center;font-size:17px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.12)}
.toast button{font:inherit;font-weight:600;background:var(--red);color:#fff;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
@media (max-width:380px){.row{grid-template-columns:62px 5px 1fr auto;gap:10px}h1{font-size:34px}}
@media (prefers-reduced-motion:no-preference){.row{transition:opacity .25s}}
</style>

<div class="wrap">
  <div class="demo">Entwurf mit <b>Beispieleinträgen</b>, im Stil von Annes Apple-Kalender.</div>
  <div class="greet" id="hello">Guten Morgen, Anne!</div>
  <div class="titlebar"><h1 id="title">Heute</h1><div class="daycircle" id="circle" aria-hidden="true"></div></div>
  <div class="sub" id="sub"></div>
  <div class="checked" id="checked"></div>
  <main id="view"></main>
</div>

<nav aria-label="Ansicht wählen"><div>
  <button data-v="heute" aria-pressed="true">Heute</button>
  <button data-v="morgen" aria-pressed="false">Morgen</button>
  <button data-v="danach" aria-pressed="false">Danach</button>
  <button data-v="suchen" aria-pressed="false">Suchen</button>
</div></nav>
<div class="toast" id="toast" hidden role="status"><span id="toastText">Erledigt</span><button id="undo">Rückgängig</button></div>

<script>
// Annes Kalender mit ihren Farben (aus ihrer Kalenderliste)
const CALS = { kalender:{name:"Kalender",v:"--cal-kalender"}, privat:{name:"Privat",v:"--cal-privat"}, arbeit:{name:"Arbeit",v:"--cal-arbeit"}, nadim:{name:"Nadim",v:"--cal-nadim"} };
// Kleine Hinweise neben dem Kalendernamen. Unklares bekommt keinen Hinweis.
const HINTS = [
  {name:"Kinder",    words:["mia","kita","schule","turnbeutel","elternabend","schwimmkurs","wechselkleidung"]},
  {name:"Arzt",      words:["arzt","kinderarzt","zahnarzt","u-untersuchung","impfung"]},
  {name:"Einkauf",   words:["kaufen","milch","brot","windeln","rewe","besorgen"]},
  {name:"Unterlagen",words:["unterlagen","steuer","versicherung","kündigen","formular","antrag"]},
  {name:"Geburtstag",words:["geburtstag","geschenk"]},
  {name:"Haushalt",  words:["tonne","handwerker","heizung","wäsche"]},
];
// d = Tage ab heute; ohne time = ganztägig
const EXAMPLES = [
  {t:"Kinderarzt mit Mia", d:0, time:"10:30", end:"11:15", cal:"kalender"},
  {t:"Mia Turnbeutel", d:0, cal:"kalender"},
  {t:"Milch und Brot kaufen", d:0, cal:"kalender"},
  {t:"Teammeeting", d:0, time:"13:00", end:"14:00", cal:"arbeit"},
  {t:"Kaffee mit Lisa", d:0, time:"15:30", end:"16:30", cal:"privat"},
  {t:"Gelbe Tonne rausstellen", d:0, time:"20:00", end:"20:15", cal:"nadim"},
  {t:"Elternabend Kita", d:1, time:"19:30", end:"21:00", cal:"kalender"},
  {t:"Oma", d:1, cal:"privat"},
  {t:"Unterlagen", d:1, cal:"kalender"},
  {t:"Geschenk für Omas Geburtstag besorgen", d:3, cal:"kalender"},
  {t:"Steuerunterlagen an Steuerberater", d:4, cal:"nadim"},
  {t:"Zahnarzt Kontrolle", d:6, time:"08:40", end:"09:10", cal:"kalender"},
  {t:"Handwerker Heizung", d:9, time:"08:00", end:"10:00", cal:"nadim"},
];

const today = new Date(); today.setHours(0,0,0,0);
const now = new Date();
const fmtWd = new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long"});
const dateOf = d => { const x = new Date(today); x.setDate(x.getDate()+d); return x; };
const h = now.getHours();
document.getElementById("hello").textContent = h < 11 ? "Guten Morgen, Anne!" : h < 18 ? "Hallo Anne!" : "Guten Abend, Anne!";
document.getElementById("checked").textContent = "Zuletzt geprüft um " + now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) + " Uhr";

const hintFor = t => { const l = t.toLowerCase(); const f = HINTS.find(c=>c.words.some(w=>l.includes(w))); return f ? f.name : ""; };
const items = EXAMPLES.map((e,i)=>({...e, id:"e"+i, hint:hintFor(e.t)}));

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem("meintag-done")||"[]")); } catch(_){}
const save = () => { try { localStorage.setItem("meintag-done", JSON.stringify([...done])); } catch(_){} };

let view = "heute", q = "", lastDone = null, toastTimer = null;
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nowMin = now.getHours()*60 + now.getMinutes();
const mins = t => { const [a,b] = t.split(":").map(Number); return a*60+b; };
const color = i => `var(${CALS[i.cal].v})`;

function row(i, tick=true){
  const isDone = done.has(i.id);
  const time = i.time ? `<div class="time">${i.time}<small>${i.end||""}</small></div>` : `<div class="time allday">ganztägig</div>`;
  const meta = [CALS[i.cal].name, i.hint].filter(Boolean).join(" · ");
  const btn = tick ? `<button class="tick" data-id="${i.id}" aria-label="${isDone?"Zurückholen":"Abhaken"}: ${esc(i.t)}">${isDone?"✓":""}</button>` : "<span></span>";
  return `<li class="row${isDone?" done":""}" style="--c:${color(i)}">${time}<span class="bar"></span><div class="t">${esc(i.t)}<span class="cal">${meta}</span></div>${btn}</li>`;
}
function dayList(d){
  const list = items.filter(i=>i.d===d);
  const open = list.filter(i=>!done.has(i.id) && (!i.time || d>0 || mins(i.end||i.time) >= nowMin))
    .sort((a,b)=>(a.time?1:0)-(b.time?1:0) || (a.time||"").localeCompare(b.time||""));
  const finished = list.filter(i=>done.has(i.id));
  let html = "";
  if (!open.length){
    const nxt = items.filter(i=>i.d>d).sort((a,b)=>a.d-b.d)[0];
    html += `<div class="sect"><div class="empty">${d===0?"Heute steht nichts mehr an.":"Morgen ist frei. Genieß den Tag!"}${nxt?`<small>Danach: ${esc(nxt.t)}, ${fmtWd.format(dateOf(nxt.d))}</small>`:""}</div></div>`;
  } else {
    html += `<div class="sect"><ul class="list">${open.map(i=>row(i)).join("")}</ul></div>`;
  }
  if (finished.length) html += `<div class="sect"><h2>${d===0?"Heute erledigt":"Erledigt"}</h2>${d===0?`<p class="cheer">Heute geschafft: ${finished.length} ${finished.length===1?"Ding":"Dinge"}</p>`:""}<ul class="list">${finished.map(i=>row(i)).join("")}</ul></div>`;
  return html;
}
function setHeader(title, d){
  document.getElementById("title").textContent = title;
  const c = document.getElementById("circle");
  if (d === null){ c.hidden = true; document.getElementById("sub").textContent = ""; return; }
  c.hidden = false; c.textContent = dateOf(d).getDate(); c.classList.toggle("off", d!==0);
  document.getElementById("sub").textContent = fmtWd.format(dateOf(d));
}
function render(){
  const v = document.getElementById("view");
  let html = "";
  if (view==="heute"){
    setHeader("Heute", 0);
    const next = items.filter(i=>i.d===0 && i.time && !done.has(i.id) && mins(i.end||i.time) >= nowMin).sort((a,b)=>a.time.localeCompare(b.time))[0];
    if (next) html += `<div class="next" style="--c:${color(next)}"><span class="bar"></span><div><div class="lbl">Als Nächstes</div><div class="what">${esc(next.t)}</div><div class="tm">${next.time}–${next.end} Uhr</div></div></div>`;
    html += dayList(0);
  } else if (view==="morgen"){
    setHeader("Morgen", 1); html += dayList(1);
  } else if (view==="danach"){
    setHeader("Danach", null);
    const later = items.filter(i=>i.d>1).sort((a,b)=>a.d-b.d || (a.time?1:0)-(b.time?1:0) || (a.time||"").localeCompare(b.time||""));
    const byDay = {}; later.forEach(i=>{ (byDay[i.d] ||= []).push(i); });
    html += Object.entries(byDay).map(([d,l])=>`<div class="sect"><h2 class="day">${fmtWd.format(dateOf(+d))}</h2><ul class="list">${l.map(i=>row(i,false)).join("")}</ul></div>`).join("")
      || `<div class="sect"><div class="empty">Danach steht noch nichts im Kalender.</div></div>`;
  } else {
    setHeader("Suchen", null);
    html += `<input id="q" class="search" type="search" placeholder="Was suchst du? z. B. Turnbeutel" aria-label="Im Kalender suchen" value="${esc(q)}">`;
    if (q){
      const hits = items.filter(i=>i.t.toLowerCase().includes(q) || i.hint.toLowerCase().includes(q)).sort((a,b)=>a.d-b.d);
      html += hits.length
        ? `<div class="sect"><ul class="list">${hits.map(i=>{ const r = row(i,false); const when = i.d===0?"Heute":i.d===1?"Morgen":fmtWd.format(dateOf(i.d)); return r.replace('<span class="cal">', `<span class="cal">${when} · `); }).join("")}</ul></div>`
        : `<div class="sect"><div class="empty">Dazu habe ich nichts gefunden.<small>Versuch ein anderes Wort.</small></div></div>`;
    }
  }
  v.innerHTML = html;
  if (view==="suchen"){
    document.getElementById("q").addEventListener("input", e=>{ q = e.target.value.trim().toLowerCase(); render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  }
}
function pling(){
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+0.4);
  } catch(_){}
}
function toast(text, undoable){
  const t = document.getElementById("toast");
  document.getElementById("toastText").textContent = text;
  document.getElementById("undo").hidden = !undoable;
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, 6000);
}
document.addEventListener("click", ev=>{
  const nb = ev.target.closest("nav button");
  if (nb){ view = nb.dataset.v; document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-pressed", b===nb)); render(); window.scrollTo(0,0); if (view==="suchen") document.getElementById("q").focus(); return; }
  const tk = ev.target.closest(".tick");
  if (tk){
    const id = tk.dataset.id;
    if (done.has(id)){ done.delete(id); toast("Wieder offen", false); }
    else { done.add(id); lastDone = id; pling(); toast("Erledigt", true); }
    save(); render(); return;
  }
  if (ev.target.id==="undo" && lastDone){ done.delete(lastDone); lastDone = null; save(); render(); document.getElementById("toast").hidden = true; }
});
render();
</script>
