<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Eintragen</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;background:#EEF4EF;color:#1D2A36;margin:0;padding:24px 16px;font-size:18px;line-height:1.4}
h1{font-size:24px;margin:0 0 8px}
p{margin:0 0 18px;color:#56616C}
button{display:block;width:100%;min-height:60px;margin:0 0 14px;border:0;border-radius:14px;background:#173653;color:#fff;font:inherit;font-weight:700;font-size:19px}
button.b{background:#fff;color:#173653;border:2px solid #173653}
#info{font-size:15px;color:#56616C}
</style></head><body>
<h1>Test: Eintragen ohne Siri</h1>
<p>Tipp auf Knopf 1. Wenn nichts passiert, auf Knopf 2. Es soll ein Apple-Fenster „Zum Kalender hinzufügen“ kommen, mit dem Eintrag „Test Milch“ für heute.</p>
<button id="b1">1 · Test Milch eintragen</button>
<button id="b2" class="b">2 · Test Milch eintragen (anderer Weg)</button>
<div id="info"></div>
<script>
function ics(){
  const d=new Date(), n=new Date(d.getTime()+864e5), f=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0");
  const now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MeinTag//DE","METHOD:PUBLISH","BEGIN:VEVENT",
    "UID:meintag-"+Date.now()+"@meintag","DTSTAMP:"+now,"DTSTART;VALUE=DATE:"+f(d),"DTEND;VALUE=DATE:"+f(n),"SUMMARY:Test Milch","END:VEVENT","END:VCALENDAR"].join("\r\n");
}
document.getElementById("b1").onclick=()=>{ location.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics()); };
document.getElementById("b2").onclick=()=>{
  const url=URL.createObjectURL(new Blob([ics()],{type:"text/calendar"}));
  const a=document.createElement("a"); a.href=url; a.download="eintrag.ics"; document.body.appendChild(a); a.click(); a.remove();
};
</script></body></html>
